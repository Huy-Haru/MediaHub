# Set your domain and TLS at the reverse proxy / hosting platform.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 51m;
  location /api/ {
    proxy_pass http://backend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /sitemap.xml { proxy_pass http://backend:5000/api/public/sitemap.xml; }
  location = /robots.txt { proxy_pass http://backend:5000/api/public/robots.txt; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri $uri/ /index.html; }
}
